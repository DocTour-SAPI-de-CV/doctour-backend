# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('DEV_DB_HOST') %> 
  port: <%= ENV.fetch('DEV_DB_PORT') %>
  username: <%= ENV.fetch('DEV_DB_USERNAME') %>
  password: <%= ENV.fetch('DEV_DB_PASSWORD') %>
  url: <%= ENV.fetch('DEV_DATABASE_URL') %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: doctourdbfree

production:
  host: <%= ENV.fetch('PROD_DB_HOST') %> 
  port: <%= ENV.fetch('PROD_DB_PORT') %>
  database: <%= ENV.fetch('PROD_DB_NAME') %> 
  username: <%= ENV.fetch('PROD_DB_USERNAME') %>
  password: <%= ENV.fetch('PROD_DB_PASSWORD') %>
  url: <%= ENV.fetch('PROD_DATABASE_URL') %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: <%= ENV.fetch('PROD_DB_TIMEOUT', 5000) %>  
 
  
  
